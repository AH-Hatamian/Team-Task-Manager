{% load static %}
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>{% block title %}Team Task Manager{% endblock %}</title>
        <link rel="stylesheet" href="{% static 'tasks/style.css' %}?v=3">
    </head>

    <body>
        <header>
            {% if user.is_authenticated %}
            <div class="top-navbar">
                <div class="nav-left">
                    <span class="greeting">Hi {{ user.username }}</span>
                    <a href="{% url 'tasks:team_list' %}">My Teams</a>
                    <a href="{% url 'tasks:my_tasks' %}">My Tasks</a>
                </div>
                
                <div class="nav-right">
                    <form action="{% url 'tasks:logout' %}" method="post">
                        {% csrf_token %}
                        <button type="submit">Log out</button>
                    </form>
                </div>
            </div>
            {% endif %}
        </header>

        <main>
            {% block content %}
            {% endblock %}
        </main>
    </body>
</html>
